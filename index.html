<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171126"><title>Winner AI — Practice</title><style>*{box-sizing:border-box}body{background:#171126;color:#f5efff;margin:0;font:16px system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:28px 18px 50px}.logo{font-size:30px;color:#c4b5fd}h1{font-size:38px;letter-spacing:-1.5px;margin:12px 0 4px}p,small{color:#c4b7dc;line-height:1.5}.card{background:#251b3a;border:1px solid #47355e;border-radius:20px;padding:18px;margin:18px 0}label{display:block;font-size:13px;color:#d1c4e5;margin:12px 0 6px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #63517e;background:#171126;color:white}button{width:100%;padding:14px;border:0;border-radius:12px;background:#b7a1ff;color:#231638;font-weight:750;margin-top:12px}button:disabled{opacity:.6}#options{display:grid;grid-template-columns:1fr 1fr;gap:8px}#options button{margin:0;color:white;min-height:65px}.best{outline:3px solid #86efac}#answer,#hint{color:#a1f3bb;white-space:pre-wrap;overflow-wrap:anywhere}h2{font-size:20px}#state{font-size:13px}</style></head><body><main><div class="logo">✦</div><small>iPHONE EDITION / PRACTICE</small><h1>Winner AI</h1><p>Тренировочная версия. Не подключается к живым играм Kahoot.</p><section class="card"><h2>Gemini · свои вопросы</h2><p id="state">Проверка сервера…</p><label>Пароль приложения</label><input id="pw" type="password" autocomplete="current-password"><label>Вопрос</label><textarea id="q" rows="3" placeholder="Какая столица Казахстана?"></textarea><label>Варианты (по одному на строку)</label><textarea id="choices" rows="4" placeholder="Алматы&#10;Астана&#10;Тараз"></textarea><button id="ask">Получить объяснение</button><p id="answer" role="status"></p></section><section class="card"><h2>Демо викторины</h2><p>Вопрос появляется за 5 секунд до вариантов. Ответы в демо заранее известны.</p><button id="start">Начать тренировку</button><p id="question"></p><div id="options"></div><p id="hint" role="status"></p><button id="next" hidden>Следующий вопрос</button></section></main><script>const e=id=>document.getElementById(id);fetch('/api/status').then(r=>r.json()).then(s=>e('state').textContent=s.configured?'Gemini настроен, проверь запросом':'Gemini ещё не настроен').catch(()=>e('state').textContent='Сервер недоступен');e('ask').onclick=async()=>{e('ask').disabled=true;e('answer').textContent='Анализ…';try{const r=await fetch('/api/solve',{method:'POST',headers:{'Content-Type':'application/json','x-app-password':e('pw').value},body:JSON.stringify({question:e('q').value,choices:e('choices').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)})});const j=await r.json();if(!r.ok)throw Error(j.error);e('answer').textContent=j.answer+'\n'+j.explanation}catch(x){e('answer').textContent=x.message}finally{e('ask').disabled=false}};const quiz=[['Столица Казахстана?',['Алматы','Астана','Тараз','Шымкент'],1],['Самая большая планета?',['Марс','Юпитер','Земля','Венера'],1],['15 × 8?',['100','130','120','115'],2]];let i=0,t,score=0;function show(){clearTimeout(t);e('options').replaceChildren();e('hint').textContent='Варианты через 5 секунд';e('next').hidden=true;e('question').textContent=quiz[i][0];t=setTimeout(()=>{quiz[i][1].forEach((v,k)=>{const b=document.createElement('button');b.textContent=v;b.style.background=['#b72947','#235db7','#98730c','#257847'][k];b.onclick=()=>{if(k===quiz[i][2])score++;Array.from(e('options').children).forEach((x,n)=>{x.disabled=true;if(n===quiz[i][2])x.className='best'});e('hint').textContent=(k===quiz[i][2]?'Верно!':'Ответ: '+quiz[i][1][quiz[i][2]])+' · '+score+'/'+(i+1);e('next').hidden=false};e('options').append(b)});e('hint').textContent='Выбери ответ'},5000)}e('start').onclick=()=>{i=0;score=0;show()};e('next').onclick=()=>{i++;if(i<quiz.length)show();else{e('question').textContent='Результат: '+score+'/'+quiz.length;e('options').replaceChildren();e('hint').textContent='Тренировка завершена';e('next').hidden=true}}</script></body></html>
